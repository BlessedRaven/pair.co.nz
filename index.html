<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PAIR Portal — animated sigil hub. Each node is its own pump.fun coin brief." />
  <meta name="theme-color" content="#0a0a0c" />
  <title>PAIR Portal — Coin Hub</title>
    <script>
    (function () {
      try {
        var t = localStorage.getItem("pair-theme");
        if (t === "vibe") t = "vibe-dark";
        if (t === "light" || t === "dark" || t === "vibe-dark" || t === "vibe-light") {
          document.documentElement.setAttribute("data-theme", t);
        }
        document.documentElement.setAttribute("data-colour", "off");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=32" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PAIR</a>
    <div class="top-right">
      <p class="tag" id="tagline">Each node is its own coin</p>
      <div class="themes" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <span class="vibe-wrap" data-vibe-wrap>
          <button type="button" data-vibe-toggle aria-pressed="false" aria-expanded="false" aria-haspopup="true">Vibe</button>
          <span class="vibe-menu" data-vibe-menu hidden>
            <button type="button" data-theme-set="vibe-dark">Vibe Dark</button>
            <button type="button" data-theme-set="vibe-light">Vibe Light</button>
          </span>
        </span>
        <button type="button" data-panel-open="symbol" aria-pressed="false" aria-expanded="false" aria-controls="motion-panel" title="Symbol options">Symbol</button>
        <button type="button" data-motion-toggle aria-pressed="false" title="Slow whole-sigil orbit">Motion</button>
      </div>
    </div>
  </header>

  <aside id="motion-panel" class="motion-panel" hidden data-motion-panel>
    <div class="motion-panel-inner">
      <p class="motion-kicker">Symbol</p>
      <div class="motion-block" data-panel-section="symbol">
        <p class="motion-label">Symbol</p>
        <div class="motion-list" data-motion-symbols role="listbox" aria-label="Symbol"></div>
        <p class="motion-label" style="margin-top:0.65rem">Animation</p>
        <div class="motion-list" data-motion-anims role="listbox" aria-label="Animation"></div>
        <p class="motion-label" style="margin-top:0.65rem">Colour</p>
        <div class="motion-list" data-motion-colours role="listbox" aria-label="Colour"></div>
        <div class="motion-speed-row" style="margin-top:0.65rem">
          <p class="motion-label">Spin speed</p>
          <span class="motion-speed-val" data-motion-speed-val>100%</span>
        </div>
        <input class="motion-speed" data-motion-speed type="range" min="1" max="100" value="100" step="1" aria-label="Spin speed" />
        <div class="motion-speed-row" style="margin-top:0.65rem">
          <p class="motion-label">Colour speed</p>
          <span class="motion-speed-val" data-motion-colour-speed-val>100%</span>
        </div>
        <input class="motion-speed" data-motion-colour-speed type="range" min="1" max="100" value="100" step="1" aria-label="Colour speed" />
      </div>
      <button type="button" class="motion-reset" data-motion-reset>Reset</button>
      <p class="motion-hint">Motion = slow whole orbit. Symbol: pick shapes, then Animation / Colour / speeds.</p>
    </div>
  </aside>

  <main class="landing" id="top" aria-label="PAIR coin hub">
    <div class="mark" data-mark>
      <div class="mark-host" data-mark-host></div>
      <svg class="hits" viewBox="0 0 923.86 886.31" role="group" aria-label="Coin nodes">
        <a class="hotspot hotspot-center" data-hotspot="torus" href="coins/pair.html" aria-label="Torus coin brief">
          <circle class="hit" cx="447.56" cy="484.96" r="155" />
          <text class="hit-label" x="447.56" y="484.96" text-anchor="middle" dy="0.35em">TORUS</text>
        </a>
        <g class="hits-orbit">
          <a class="hotspot" data-hotspot="scarab" href="coins/raven.html" aria-label="Scarab coin brief">
            <circle class="hit" cx="453.6" cy="188" r="78" />
            <text class="hit-label" x="453.6" y="188" text-anchor="middle" dy="0.35em">SCARAB</text>
          </a>
          <a class="hotspot" data-hotspot="sun" href="coins/raven.html" aria-label="Sun coin brief">
            <circle class="hit" cx="453.6" cy="165" r="28" />
            <text class="hit-label" x="520" y="150" text-anchor="middle" dy="0.35em">SUN</text>
          </a>
          <a class="hotspot" data-hotspot="key" href="coins/raven.html" aria-label="Key coin brief">
            <circle class="hit" cx="460.8" cy="70" r="36" />
            <text class="hit-label" x="520" y="70" text-anchor="middle" dy="0.35em">KEY</text>
          </a>
          <a class="hotspot" data-hotspot="bean" href="coins/raven.html" aria-label="Bean coin brief">
            <circle class="hit" cx="452" cy="8" r="18" />
            <text class="hit-label" x="500" y="14" text-anchor="middle" dy="0.35em">BEAN</text>
          </a>
          <a class="hotspot" data-hotspot="pi" href="coins/archive.html" aria-label="Pi coin brief">
            <circle class="hit" cx="148" cy="167" r="90" />
            <text class="hit-label" x="148" y="167" text-anchor="middle" dy="0.35em">PI</text>
          </a>
          <a class="hotspot" data-hotspot="cloud" href="coins/orbit.html" aria-label="Cloud coin brief">
            <circle class="hit" cx="91.8" cy="353" r="85" />
            <text class="hit-label" x="91.8" y="353" text-anchor="middle" dy="0.35em">CLOUD</text>
          </a>
          <a class="hotspot" data-hotspot="trinity" href="coins/wings.html" aria-label="Trinity coin brief">
            <circle class="hit" cx="90" cy="555" r="90" />
            <text class="hit-label" x="90" y="555" text-anchor="middle" dy="0.35em">TRINITY</text>
          </a>
          <a class="hotspot" data-hotspot="ra" href="coins/raven.html" aria-label="Ra coin brief">
            <circle class="hit" cx="215.7" cy="760" r="88" />
            <text class="hit-label" x="215.7" y="760" text-anchor="middle" dy="0.35em">RA</text>
          </a>
          <a class="hotspot" data-hotspot="hermes" href="coins/fund.html" aria-label="Hermes coin brief">
            <circle class="hit" cx="462" cy="820" r="90" />
            <text class="hit-label" x="462" y="820" text-anchor="middle" dy="0.35em">HERMES</text>
          </a>
          <a class="hotspot" data-hotspot="fol" href="coins/nest.html" aria-label="FOL coin brief">
            <circle class="hit" cx="672.71" cy="750.29" r="105" />
            <text class="hit-label" x="672.71" y="750.29" text-anchor="middle" dy="0.35em">FOL</text>
          </a>
          <a class="hotspot" data-hotspot="sol" href="coins/torus.html" aria-label="SOL coin brief">
            <circle class="hit" cx="821.16" cy="582.19" r="100" />
            <text class="hit-label" x="821.16" y="582.19" text-anchor="middle" dy="0.35em">SOL</text>
          </a>
          <a class="hotspot" data-hotspot="gol" href="coins/flower.html" aria-label="GOL coin brief">
            <circle class="hit" cx="820.1" cy="342.59" r="100" />
            <text class="hit-label" x="820.1" y="342.59" text-anchor="middle" dy="0.35em">GOL</text>
          </a>
          <a class="hotspot" data-hotspot="flower" href="coins/flower.html" aria-label="Flower coin brief">
            <circle class="hit" cx="706.6" cy="168" r="88" />
            <text class="hit-label" x="706.6" y="168" text-anchor="middle" dy="0.35em">FLOWER</text>
          </a>
        </g>
      </svg>
    </div>
    <p class="hint">Hover or tap a node · opens coin brief</p>
  </main>

  <footer class="foot">
    <a href="donate.html">Donate</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/BlessedRaven/pair.co.nz" rel="noopener noreferrer" target="_blank">GitHub</a>
    <span aria-hidden="true">·</span>
    <span class="muted">Mints TBD · not financial advice</span>
  </footer>

  <script src="theme.js?v=32" defer></script>
  <script src="motion.js?v=32" defer></script>
  <script src="app.js?v=32" defer></script>
</body>
</html>
