<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Orbit (ORBIT) — PAIR Portal</title>
    <script>
    (function () {
      try {
        var th = localStorage.getItem("pair-theme");
        if (th === "light" || th === "vibe" || th === "dark") {
          document.documentElement.setAttribute("data-theme", th);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../styles.css?v=15" />
</head>
<body>
  <header class="top">
    <a class="brand" href="../">PAIR</a>
    <div class="top-right">
      <p class="tag">Coin brief</p>
      <div class="themes" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="vibe" aria-pressed="false">Vibe</button>
      </div>
    </div>
  </header>
  <article class="brief">
    <h1>Orbit</h1>
    <span class="ticker">ORBIT</span>
    <p>Open slot — merger / horizon experiments and sim work.</p>
    <div class="panel">
      <h2>pump.fun</h2>
      <p id="pump"><span class="muted">Coming soon — mint not live yet.</span></p>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="#" aria-disabled="true">Open on pump.fun</a>
      <a class="btn btn-ghost" href="../">Back to hub</a>
    </div>
    <p class="muted" style="margin-top:2rem;font-size:0.75rem">Placeholder mint until launch. Not financial advice. Meme coins are high risk.</p>
  </article>
  <script src="../theme.js?v=15" defer></script>
</body>
</html>
