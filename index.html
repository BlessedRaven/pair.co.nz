<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PAIR Portal — animated sigil hub. Each node is its own pump.fun coin brief." />
  <meta name="theme-color" content="#0a0a0c" />
  <title>PAIR Portal — Coin Hub</title>
    <script>
    (function () {
      try {
        var t = localStorage.getItem("pair-theme");
        if (t === "light" || t === "vibe" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PAIR</a>
    <div class="top-right">
      <p class="tag" id="tagline">Each node is its own coin</p>
      <div class="themes" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="vibe" aria-pressed="false">Vibe</button>
        <button type="button" data-motion-toggle aria-pressed="false" aria-expanded="false" aria-controls="motion-panel" title="Motion controls">Motion</button>
      </div>
    </div>
  </header>

  <aside id="motion-panel" class="motion-panel" hidden data-motion-panel>
    <div class="motion-panel-inner">
      <p class="motion-kicker">Motion</p>
      <div class="motion-block">
        <p class="motion-label">Symbol</p>
        <div class="motion-list" data-motion-symbols role="listbox" aria-label="Symbol"></div>
      </div>
      <div class="motion-block">
        <p class="motion-label">Animation</p>
        <div class="motion-list" data-motion-anims role="listbox" aria-label="Animation"></div>
      </div>
      <div class="motion-block">
        <div class="motion-speed-row">
          <p class="motion-label">Speed</p>
          <span class="motion-speed-val" data-motion-speed-val>1x</span>
        </div>
        <input class="motion-speed" data-motion-speed type="range" min="35" max="200" value="100" step="5" aria-label="Animation speed" />
      </div>
      <p class="motion-hint">Pick a symbol, then an animation. Speed applies to that symbol.</p>
    </div>
  </aside>

  <main class="landing" id="top" aria-label="PAIR coin hub">
    <div class="mark" data-mark>
      <div class="mark-host" data-mark-host></div>
      <svg class="hits" viewBox="0 0 923.86 886.31" role="group" aria-label="Coin nodes">
        <a class="hotspot hotspot-center" data-hotspot="center" href="coins/pair.html" aria-label="PAIR coin brief">
          <circle class="hit" cx="447.56" cy="484.96" r="155" />
          <text class="hit-label" x="447.56" y="484.96" text-anchor="middle" dy="0.35em">PAIR</text>
        </a>
        <g class="hits-orbit">
          <a class="hotspot" data-hotspot="n" href="coins/raven.html" aria-label="RAVEN coin brief">
            <circle class="hit" cx="453.56" cy="145" r="100" />
            <text class="hit-label" x="453.56" y="145" text-anchor="middle" dy="0.35em">RAVEN</text>
          </a>
          <a class="hotspot" data-hotspot="nw" href="coins/archive.html" aria-label="Archive coin brief">
            <circle class="hit" cx="148" cy="167" r="90" />
            <text class="hit-label" x="148" y="167" text-anchor="middle" dy="0.35em">ARC</text>
          </a>
          <a class="hotspot" data-hotspot="w" href="coins/orbit.html" aria-label="Orbit coin brief">
            <circle class="hit" cx="91.8" cy="353" r="85" />
            <text class="hit-label" x="91.8" y="353" text-anchor="middle" dy="0.35em">ORBIT</text>
          </a>
          <a class="hotspot" data-hotspot="sw" href="coins/wings.html" aria-label="Wings coin brief">
            <circle class="hit" cx="90" cy="555" r="90" />
            <text class="hit-label" x="90" y="555" text-anchor="middle" dy="0.35em">WINGS</text>
          </a>
          <a class="hotspot" data-hotspot="s" href="coins/fund.html" aria-label="Fund coin brief">
            <circle class="hit" cx="462" cy="820" r="90" />
            <text class="hit-label" x="462" y="820" text-anchor="middle" dy="0.35em">FUND</text>
          </a>
          <a class="hotspot" data-hotspot="se" href="coins/nest.html" aria-label="Nest coin brief">
            <circle class="hit" cx="672.71" cy="750.29" r="105" />
            <text class="hit-label" x="672.71" y="750.29" text-anchor="middle" dy="0.35em">NEST</text>
          </a>
          <a class="hotspot" data-hotspot="e" href="coins/torus.html" aria-label="Torus coin brief">
            <circle class="hit" cx="821.16" cy="582.19" r="100" />
            <text class="hit-label" x="821.16" y="582.19" text-anchor="middle" dy="0.35em">TORUS</text>
          </a>
          <a class="hotspot" data-hotspot="ne" href="coins/flower.html" aria-label="Flower coin brief">
            <circle class="hit" cx="820.1" cy="342.59" r="100" />
            <text class="hit-label" x="820.1" y="342.59" text-anchor="middle" dy="0.35em">FLOWER</text>
          </a>
        </g>
      </svg>
    </div>
    <p class="hint">Hover or tap a node · opens coin brief</p>
  </main>

  <footer class="foot">
    <a href="donate.html">Donate</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/BlessedRaven/pair.co.nz" rel="noopener noreferrer" target="_blank">GitHub</a>
    <span aria-hidden="true">·</span>
    <span class="muted">Mints TBD · not financial advice</span>
  </footer>

  <script src="theme.js?v=21" defer></script>
  <script src="motion.js?v=21" defer></script>
  <script src="app.js?v=21" defer></script>
</body>
</html>
